<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent traffic dashboard</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1d2330; --muted: #6b7280; --line: #e3e6eb; --hover: #eef2f7; --sel: #dbe7ff;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --c-system: #7c3aed; --c-tools: #c2410c; --c-conv: #2563eb; --c-new: #047857; --c-reply: #be185d; --c-params: #64748b;
  --err: #dc2626; --err-bg: #fdecec; --warn: #b45309; --ok: #15803d;
  --j-key: #9333ea; --j-str: #047857; --j-num: #1d4ed8; --j-bool: #c2410c; --j-null: #6b7280;
  --user-bg: #f1f6ff; --asst-bg: #fbf5ff; --new-bg: #ecfdf5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1a1e26; --fg: #e3e7ee; --muted: #9aa3b2; --line: #2c323d; --hover: #222834; --sel: #213152;
    --c-system: #a78bfa; --c-tools: #fb923c; --c-conv: #60a5fa; --c-new: #34d399; --c-reply: #f472b6; --c-params: #94a3b8;
    --err: #f87171; --err-bg: #3a1d1f; --warn: #fbbf24; --ok: #4ade80;
    --j-key: #c084fc; --j-str: #6ee7b7; --j-num: #93c5fd; --j-bool: #fdba74; --j-null: #9aa3b2;
    --user-bg: #18233a; --asst-bg: #261b33; --new-bg: #10291f;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.45 var(--sans); background: var(--bg); color: var(--fg); display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; cursor: pointer; }
button:hover { background: var(--hover); }
a { color: var(--c-conv); cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }
input[type=search] { font: inherit; padding: 3px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--fg); width: 240px; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.small { font-size: 11px; }

/* top bar */
#top { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#top h1 { font-size: 14px; margin: 0 8px 0 0; }
#conn { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
#conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
#conn.live::before { background: var(--ok); }
#conn.reconnecting::before { background: var(--warn); }
#top .spacer { flex: 1; }
#banner { background: #fff7e0; color: #6b4e00; border-bottom: 1px solid #f1dfa6; padding: 4px 12px; font-size: 12px; display: flex; gap: 8px; align-items: center; }
@media (prefers-color-scheme: dark) { #banner { background: #2e2710; color: #f3d98b; border-color: #4a3f17; } }
#banner button { padding: 0 6px; }

/* summary */
#summary { display: flex; gap: 6px; padding: 6px 12px; background: var(--bg); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; min-width: 70px; }
.tile:hover { background: var(--hover); }
.tile .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.tile .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .chip { display: inline-block; margin-right: 4px; color: var(--err); }
.tile .chip:hover { text-decoration: underline; }

/* main */
#main { flex: 1; display: grid; grid-template-columns: minmax(330px, 34%) 1fr; min-height: 0; }
#left { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
#list-h { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); font-weight: 600; }
#list-h label { font-weight: normal; font-size: 12px; margin-left: auto; }
#list { overflow-y: auto; flex: 1; }
.row { padding: 5px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); }
.row .l1 { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.row .l1 .model { overflow: hidden; text-overflow: ellipsis; flex: 1; color: var(--muted); }
.row .l2 { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 1px; }
.row .l2 b { color: var(--fg); font-weight: 600; }
.row .err { color: var(--err); font-size: 12px; margin-top: 1px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.row.check { opacity: .55; padding: 2px 10px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .id { font-weight: 700; font-variant-numeric: tabular-nums; }
.status { font-family: var(--mono); font-size: 11.5px; padding: 0 4px; border-radius: 3px; background: var(--hover); }
.status.bad { background: var(--err-bg); color: var(--err); }
.lbl { font-size: 11px; border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; margin-left: 4px; color: var(--warn); }
.spin { width: 11px; height: 11px; border: 2px solid var(--line); border-top-color: var(--c-reply); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { padding: 24px; color: var(--muted); }

/* detail */
#right { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
#dhead { padding: 8px 14px 0; background: var(--bg); }
#dtitle { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#strip { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
#strip .s { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; cursor: pointer; font-variant-numeric: tabular-nums; }
#strip .s:hover { background: var(--hover); }
#strip .s span { color: var(--muted); font-size: 11px; margin-right: 4px; }
#tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 14px; background: var(--bg); align-items: flex-end; }
#tabs .tab { border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; padding: 4px 12px; background: transparent; }
#tabs .tab.on { background: var(--panel); border-color: var(--line); margin-bottom: -1px; font-weight: 600; }
#tabs .tab.t-reply.on { color: var(--c-reply); border-top: 3px solid var(--c-reply); }
#tabs .tab.t-request.on { border-top: 3px solid var(--c-conv); }
#tabs .tab:disabled { opacity: .4; cursor: default; }
#tabs .spacer { flex: 1; }
#tabs .tabctl { margin-bottom: 4px; font-size: 11.5px; }
#body { flex: 1; overflow-y: auto; padding: 12px 14px 60px; background: var(--panel); min-width: 0; }

/* panels */
.panel { border: 1px solid var(--line); border-left: 4px solid var(--acc, var(--line)); border-radius: 6px; margin-bottom: 18px; background: var(--panel); }
.panel-h { position: sticky; top: -12px; z-index: 3; background: var(--panel); display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0; }
.panel-h .name { color: var(--acc); font-weight: 700; }
.panel-h .cnt { color: var(--muted); }
.panel-h .ctl { margin-left: auto; display: flex; gap: 4px; }
.panel-h .ctl button { font-size: 11px; padding: 0 6px; }
.panel-b { padding: 8px 10px; }
.p-system { --acc: var(--c-system); } .p-tools { --acc: var(--c-tools); } .p-conv { --acc: var(--c-conv); }
.p-new { --acc: var(--c-new); background: var(--new-bg); } .p-new .panel-h { background: var(--new-bg); }
.p-params { --acc: var(--c-params); } .p-reply { --acc: var(--c-reply); } .p-neutral { --acc: var(--c-params); }
.p-error { --acc: var(--err); }
#pindex { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
#pindex a { border: 1px solid var(--line); border-left: 4px solid var(--acc); padding: 1px 8px; border-radius: 4px; color: var(--fg); }

/* text */
.txt { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
.txt.long .lt-body { max-height: calc(6 * 1.45em); overflow: hidden; position: relative; }
.txt.long:not(.open) .lt-body::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.2em; background: linear-gradient(to bottom, transparent, var(--fadebg, var(--panel))); }
.txt.long.open .lt-body { max-height: none; }
.lt-toggle { margin-top: 3px; font-size: 11.5px; color: var(--c-conv); border-color: transparent; background: transparent; padding: 0; }
.lt-toggle:hover { text-decoration: underline; background: transparent; }
.mono .txt, .txt.mono { font-family: var(--mono); font-size: 12px; }
.fold-h { border: none; background: transparent; padding: 0; color: var(--muted); font-size: 12px; }
.fold-h:hover { background: transparent; color: var(--fg); }
.fold-b { margin-top: 4px; }

/* json */
.json { font-family: var(--mono); font-size: 12px; position: relative; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; margin: 3px 0; overflow-wrap: anywhere; }
.json-tools { position: absolute; right: 4px; top: 3px; z-index: 1; }
.json-tools button, .copy { font-size: 10.5px; padding: 0 5px; }
.j-kids { padding-left: 2ch; }
.j-line { white-space: pre-wrap; }
.j-key { color: var(--j-key); } .j-str { color: var(--j-str); } .j-num { color: var(--j-num); } .j-bool { color: var(--j-bool); } .j-null { color: var(--j-null); }
.j-str.txt { display: inline-block; vertical-align: top; max-width: 100%; }
.j-punc { color: var(--muted); }
.j-tog { cursor: pointer; color: var(--muted); display: inline-block; width: 1.5ch; user-select: none; }
.j-sum { cursor: pointer; color: var(--muted); font-style: italic; }
.j-fmt { font-size: 10px; padding: 0 4px; margin: 0 4px; }

/* messages */
.card { border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; background: var(--panel); }
.card.role-user { background: var(--user-bg); --fadebg: var(--user-bg); margin-right: 8%; }
.card.role-assistant { background: var(--asst-bg); --fadebg: var(--asst-bg); margin-left: 8%; }
.card.isnew { box-shadow: 0 0 0 2px var(--c-new); }
.card-h { display: flex; gap: 8px; align-items: center; padding: 3px 8px; border-bottom: 1px solid var(--line); font-size: 12px; }
.card-h .role { font-weight: 700; }
.card-h .open { margin-left: auto; font-size: 11.5px; }
.card-b { padding: 6px 8px; }
.blk { margin: 4px 0 8px; }
.badge { display: inline-block; font-size: 10.5px; font-family: var(--mono); padding: 0 5px; border-radius: 3px; margin-right: 6px; color: #fff; background: var(--c-params); }
.b-text { background: #475569; } .b-tool_use { background: var(--c-tools); } .b-tool_result { background: var(--c-new); }
.b-thinking, .b-redacted_thinking { background: #7c3aed; } .b-image, .b-document { background: #0e7490; }
.cache { font-size: 10.5px; color: var(--warn); border: 1px dashed var(--warn); padding: 0 4px; border-radius: 3px; margin-left: 4px; }
.iserr { color: #fff; background: var(--err); font-size: 10.5px; padding: 0 5px; border-radius: 3px; font-weight: 700; }
.toolname { font-weight: 700; font-family: var(--mono); }
.tooldef { border-bottom: 1px dashed var(--line); padding: 6px 0 8px; }
.tooldef:last-child { border-bottom: none; }
.sysblk { margin-bottom: 10px; }

/* pairs */
.pair { border: 1px solid var(--line); border-radius: 6px; margin: 6px 0; background: var(--panel); --fadebg: var(--panel); }
.pair-h { display: flex; gap: 8px; align-items: center; padding: 3px 8px; border-bottom: 1px solid var(--line); font-size: 12px; flex-wrap: wrap; }
.pair-cols { display: grid; grid-template-columns: 1fr 1fr; }
.pair-cols > div { padding: 6px 8px; min-width: 0; }
.pair-cols > div + div { border-left: 1px solid var(--line); }
.pair-side-h { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pstat { font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); }
.pstat.pending { color: var(--warn); border-color: var(--warn); }
.pstat.no_result { color: var(--muted); border-style: dashed; }
.pstat.paired { color: var(--ok); border-color: var(--ok); }

/* tables */
table.kv, table.grid { border-collapse: collapse; width: 100%; font-size: 12px; }
table.kv td, table.grid td, table.grid th { border-bottom: 1px solid var(--line); padding: 3px 6px; vertical-align: top; text-align: left; }
table.kv td:first-child { font-family: var(--mono); color: var(--muted); width: 30%; white-space: nowrap; }
table.kv td { overflow-wrap: anywhere; }
table.grid th { color: var(--muted); font-weight: 600; }
table.grid tr.click { cursor: pointer; }
table.grid tr.click:hover { background: var(--hover); }
table.grid td.n, table.grid th.n { text-align: right; font-variant-numeric: tabular-nums; }
.errbox { border: 1px solid var(--err); background: var(--err-bg); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; }
.errbox .t { color: var(--err); font-weight: 700; font-family: var(--mono); }
.note { color: var(--muted); margin: 4px 0 10px; }
.h3 { font-weight: 700; margin: 14px 0 6px; }

/* modal */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 20; }
#modal.on { display: block; }
#modal .box { position: absolute; inset: 4% 6%; background: var(--panel); border-radius: 8px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
#modal .mh { padding: 8px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; font-weight: 600; }
#modal .mh button { margin-left: auto; }
#modal .mb { overflow-y: auto; padding: 12px 14px; flex: 1; }
.mblock { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; margin-bottom: 10px; }
.mblock .full { white-space: pre-wrap; overflow-wrap: anywhere; }
#toast { position: fixed; bottom: 14px; right: 14px; background: var(--fg); color: var(--bg); padding: 4px 10px; border-radius: 5px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
#toast.on { opacity: .9; }
</style>
</head>
<body>
<div id="top">
  <h1>Agent traffic</h1>
  <span id="conn" class="connecting">connecting…</span>
  <button id="pause" title="Pause / resume live updates">Pause</button>
  <button id="clear" title="Empty the server buffer">Clear</button>
  <a id="export" href="/api/export" download><button tabindex="-1">Export</button></a>
  <button id="toolsbtn" title="Every tool call beside its result">Tools</button>
  <input id="filter" type="search" placeholder="Filter: path, model or text">
  <span class="spacer"></span>
  <span class="muted small" id="upstream"></span>
</div>
<div id="banner"><span>⚠ Conversation contents (prompts, files, tool output) are shown here in full. Be careful when sharing screenshots or exports. Secret headers are redacted.</span><button id="banner-x" title="Hide">×</button></div>
<div id="summary"></div>
<div id="main">
  <div id="left">
    <div id="list-h"><span id="list-title">Exchanges</span><label><input type="checkbox" id="hidechecks" checked> hide checks</label></div>
    <div id="list"></div>
  </div>
  <div id="right">
    <div id="dhead"><div id="dtitle"></div><div id="strip"></div></div>
    <div id="tabs"></div>
    <div id="body"></div>
  </div>
</div>
<div id="modal"><div class="box"><div class="mh"><span id="mtitle"></span><button id="mclose">Close (Esc)</button></div><div class="mb" id="mbody"></div></div></div>
<div id="toast"></div>
<script>
'use strict';
// All model/tool content is inserted with textContent / text nodes only. Never innerHTML.

const S = {
  ex: new Map(),          // id -> exchange
  tools: {},              // tool_use_id -> pair entry
  max: 200,
  route: { view: 'none' },
  sel: null,              // last selected exchange id
  tab: 'request',
  open: new Map(),        // fold/collapse state, keyed, survives re-renders
  paused: false, queue: [],
  filter: '', hideChecks: true,
  conn: 'connecting',
  visibleIds: [],
  dirty: { list: false, rows: new Set(), summary: false, detail: false },
  scrollTo: null,
  fetching: new Set(),
};

// ------------------------------------------------------------------ helpers
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style') el.style.cssText = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  add(el, kids);
  return el;
}
function add(el, kids) {
  for (const k of kids) {
    if (k == null || k === false) continue;
    if (Array.isArray(k)) add(el, k);
    else if (k instanceof Node) el.appendChild(k);
    else el.appendChild(document.createTextNode(String(k)));
  }
  return el;
}
const fmtInt = n => n == null ? '—' : Number(n).toLocaleString('en-US');
function fmtK(n) { if (n == null) return '—'; n = Number(n); if (n < 1000) return String(Math.round(n)); if (n < 1e6) return (n / 1000).toFixed(n < 1e4 ? 1 : 0) + 'k'; return (n / 1e6).toFixed(2) + 'M'; }
function fmtChars(n) { return n < 1000 ? String(n) : (n / 1000).toFixed(1) + 'k'; }
function fmtMs(ms) { if (ms == null) return '—'; if (ms < 1000) return Math.round(ms) + ' ms'; if (ms < 60000) return (ms / 1000).toFixed(1) + ' s'; const m = Math.floor(ms / 60000); return m + 'm ' + Math.round((ms % 60000) / 1000) + 's'; }
function fmtCost(c) { if (c == null) return '—'; return '$' + (c < 0.01 ? c.toFixed(4) : c < 10 ? c.toFixed(3) : c.toFixed(2)); }
function fmtPct(x) { return x == null ? '—' : Math.round(x * 100) + '%'; }
function fmtTime(iso) { if (!iso) return ''; const d = new Date(iso); return d.toLocaleTimeString('en-GB', { hour12: false }); }
function lineCount(t) { let n = 1; for (let i = 0; i < t.length; i++) if (t.charCodeAt(i) === 10) n++; return n; }
function isLong(t) { return t.length > 1000 || lineCount(t) > 12; }
function preview(t) {
  let idx = -1;
  for (let i = 0; i < 6; i++) { const j = t.indexOf('\n', idx + 1); if (j < 0) { idx = -1; break; } idx = j; }
  let p = idx < 0 ? t : t.slice(0, idx);
  if (p.length > 1500) p = p.slice(0, 1500);
  return p + '…';
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1200); }
function copyText(text) {
  const fallback = () => {
    const ta = h('textarea', { style: 'position:fixed;left:-9999px' }); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('copied'); } catch (e) { toast('copy failed'); }
    ta.remove();
  };
  try {
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => toast('copied'), fallback);
    else fallback();
  } catch (e) { fallback(); }
}
function copyBtn(get, label) { return h('button', { class: 'copy', title: 'Copy exact text', onclick: e => { e.stopPropagation(); copyText(get()); } }, label || 'copy'); }
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function exLink(id, tab, label) {
  return h('a', { href: `#/exchange/${id}/${tab || 'request'}`, onclick: e => e.stopPropagation() }, label || `#${id}`);
}

// ------------------------------------------------------------------ data helpers
function isCheck(ex) { return ex.kind === 'check'; }
function usage(ex) { return (ex.assembled && ex.assembled.usage) || {}; }
function hasUsage(ex) { const u = usage(ex); return u.input_tokens != null || u.output_tokens != null; }
// One meaning per label, everywhere: input = usage.input_tokens; prompt = input + cache read + cache write; output = usage.output_tokens.
function tok(ex) {
  const u = usage(ex);
  const input = u.input_tokens || 0, cr = u.cache_read_input_tokens || 0, cw = u.cache_creation_input_tokens || 0, out = u.output_tokens || 0;
  const prompt = input + cr + cw;
  return { input, cr, cw, out, prompt, hit: prompt ? cr / prompt : null };
}
function modelOf(ex) { return (ex.assembled && ex.assembled.model) || (ex.request_body && typeof ex.request_body === 'object' && ex.request_body.model) || ''; }
function isAbort(ex) { return ex.error && /^client disconnected/.test(ex.error); }
function isError(ex) { return (ex.status >= 400) || (ex.error && !isAbort(ex)) || !!(ex.error_info && ex.error_info.in_stream); }
function errorText(ex) {
  const ei = ex.error_info;
  let s = '';
  if (ei) {
    s = `${ex.status || ''} ${ei.type || 'error'}${ei.message ? ': ' + ei.message : ''}`.trim();
    if (ei.retry_after) s += ` · retry after ${ei.retry_after}s`;
  } else if (ex.error) s = `${ex.status || ''} proxy error: ${ex.error}`.trim();
  else if (ex.status >= 400) s = `${ex.status} ${ex.reason || ''}`;
  return s;
}
function parts(body) {
  if (!body || typeof body !== 'object') return { system: undefined, msgs: null };
  const system = body.system !== undefined ? body.system : body.instructions;
  let msgs = Array.isArray(body.messages) ? body.messages : (Array.isArray(body.input) ? body.input : null);

    const s = m.get(name) || { name, calls: 0, errors: 0, sizeSum: 0, sizeN: 0, latSum: 0, latN: 0, pending: 0, noRes: 0 };
    s.calls++; if (e.is_error) s.errors++;
    if (e.result_size != null && e.status === 'paired') { s.sizeSum += e.result_size; s.sizeN++; }
    if (e.latency_ms != null) { s.latSum += e.latency_ms; s.latN++; }
    if (e.status === 'pending') s.pending++; if (e.status === 'no_result') s.noRes++;
    m.set(name, s);
  }
  return [...m.values()].sort((a, b) => b.calls - a.calls);
}
function pairOrder(e) { return Math.max(e.call_exchange || 0, e.result_exchange || 0) * 1e6 + (e.seq || 0); }
function toolsView(tool) {
  const stats = toolStats();
  const tbl = h('table', { class: 'grid' }, h('tr', null, h('th', null, 'tool'), h('th', { class: 'n' }, 'calls'), h('th', { class: 'n' }, 'errors'), h('th', { class: 'n' }, 'pending / no result'), h('th', { class: 'n' }, 'avg result size'), h('th', { class: 'n' }, 'avg call → result')));
  for (const s of stats) tbl.appendChild(h('tr', { class: 'click' + (tool === s.name ? ' sel' : ''), style: tool === s.name ? 'background:var(--sel)' : null, onclick: () => go(tool === s.name ? '#/tools' : '#/tools/' + encodeURIComponent(s.name)) },
    h('td', { class: 'toolname' }, s.name), h('td', { class: 'n' }, s.calls), h('td', { class: 'n', style: s.errors ? 'color:var(--err)' : null }, s.errors), h('td', { class: 'n' }, `${s.pending} / ${s.noRes}`),
    h('td', { class: 'n' }, s.sizeN ? fmtChars(Math.round(s.sizeSum / s.sizeN)) + ' chars' : '—'), h('td', { class: 'n' }, s.latN ? fmtMs(s.latSum / s.latN) : '—')));
  let pairs = Object.entries(S.tools);
  if (tool) pairs = pairs.filter(([, e]) => (e.name || '(unknown)') === tool);
  pairs.sort((a, b) => pairOrder(b[1]) - pairOrder(a[1]));
  const LIMIT = 150;
  const shown = S.open.get('tools/all') ? pairs : pairs.slice(0, LIMIT);
  return h('div', null,
    panel('tool-usage', 'p-tools', 'Tool usage', `· ${stats.length} tools · ${Object.keys(S.tools).length} calls`, [stats.length ? tbl : h('div', { class: 'muted' }, 'No tool calls yet.'),
      h('div', { class: 'note small' }, 'Click a tool to list every call and its result. "avg call → result" runs from the end of the reply that asked for the tool to the start of the request that carries the result.')]),
    panel('tool-pairs', 'p-tools', tool ? `Calls of ${tool}` : 'Every tool call beside its result', `· ${pairs.length} · newest first`,
      [tool ? h('div', { class: 'note' }, h('a', { onclick: () => go('#/tools') }, '← all tools')) : null,
        shown.length ? shown.map(([tid, e]) => pairRow(tid, `tools/${tid}`)) : h('div', { class: 'muted' }, 'None.'),
        pairs.length > shown.length ? h('button', { onclick: () => { S.open.set('tools/all', true); S.dirty.detail = true; schedule(); } }, `Show all ${pairs.length}`) : null]));
}

function statView(metric, arg) {
  if (metric === 'tools') return toolsView(null);
  const api = [...S.ex.values()].filter(e => !isCheck(e)).sort((a, b) => b.id - a.id);
  const defs = {
    requests: ['Requests', api, e => fmtMs(e.timing && e.timing.total_ms), 'duration'],
    prompt: ['prompt tokens (input + cache read + cache write)', api.filter(hasUsage), e => fmtInt(tok(e).prompt), 'prompt'],
    output: ['output tokens', api.filter(hasUsage), e => fmtInt(tok(e).out), 'output'],
    cache_read: ['cache read tokens', api.filter(hasUsage), e => fmtInt(tok(e).cr), 'cache read'],
    cache_write: ['cache write tokens', api.filter(hasUsage), e => fmtInt(tok(e).cw), 'cache write'],
    cost: ['Cost', api.filter(e => e.ended_at && hasUsage(e)), e => fmtCost(e.cost_usd), 'cost'],
    wall: ['Wall clock (first request start → last reply end)', [...S.ex.values()].sort((a, b) => b.id - a.id), e => fmtMs(e.timing && e.timing.total_ms), 'duration'],
    latency: ['Latency (successful requests)', api.filter(e => e.ended_at && !isError(e)), e => fmtMs(e.timing && e.timing.total_ms), 'total'],
    cache_hit: ['Cache hit (cache read / prompt)', api.filter(hasUsage), e => fmtPct(tok(e).hit), 'cache hit'],
    errors: ['Errors' + (arg ? ` with status ${arg}` : ''), [...S.ex.values()].filter(e => isError(e) && (!arg || String(e.status || 'proxy') === arg)).sort((a, b) => b.id - a.id), e => errorText(e), 'reason'],
  };
  const d = defs[metric];
  if (!d) return h('div', { class: 'empty' }, 'Unknown statistic.');
  const [title, rows, val, col] = d;
  const tbl = h('table', { class: 'grid' }, h('tr', null, h('th', null, 'exchange'), h('th', null, 'time'), h('th', null, 'model'), h('th', null, 'stop / status'), h('th', { class: 'n' }, col)));
  for (const e of rows) tbl.appendChild(h('tr', { class: 'click', onclick: () => go(`#/exchange/${e.id}/${metric === 'errors' ? 'reply' : 'request'}`) },
    h('td', null, `#${e.id}`), h('td', null, fmtTime(e.started_at)), h('td', null, modelOf(e) || e.path), h('td', null, (e.assembled && e.assembled.stop_reason) || e.status || ''), h('td', { class: 'n' }, val(e))));
  const s = sessionStats();
  const totals = { prompt: fmtInt(s.prompt), output: fmtInt(s.output), cache_read: fmtInt(s.cr), cache_write: fmtInt(s.cw), cost: fmtCost(s.cost), cache_hit: fmtPct(s.hit), latency: fmtMs(s.avgLat) + ' average', wall: fmtMs(s.wall), requests: String(s.requests) };
  return panel('stat', 'p-params', title, `· ${rows.length} exchange${rows.length === 1 ? '' : 's'}` + (totals[metric] ? ` · total ${totals[metric]}` : ''),
    [h('div', { class: 'note small' }, 'Click a row to open the exchange; open any message from there for its full content and raw JSON.'), rows.length ? tbl : h('div', { class: 'muted' }, 'None.')]);
}

// ------------------------------------------------------------------ message drill-down (modal)
function renderModal() {
  const modal = document.getElementById('modal');
  const r = S.route;
  if (r.view !== 'exchange' || r.msg == null) { modal.classList.remove('on'); return; }
  const ex = S.ex.get(r.id);
  const mb = document.getElementById('mbody'), mt = document.getElementById('mtitle');
  mb.textContent = '';
  if (!ex) { modal.classList.remove('on'); return; }
  let msg, title;
  const { msgs } = parts(ex.request_body);
  if (r.msg === 'reply') { msg = { role: 'assistant', content: (ex.assembled && ex.assembled.content) || [] }; title = `assistant · reply of exchange #${ex.id}`; }
  else {
    const i = Number(r.msg);
    msg = msgs && msgs[i];
    if (msg === undefined) { mt.textContent = 'Message not found'; mb.append(h('div', { class: 'empty' }, `Exchange #${ex.id} has no message #${r.msg}.`)); modal.classList.add('on'); return; }
    title = `${normMsg(msg).role} #${i} · messages[${i}] (${i + 1} of ${msgs.length}) · request #${ex.id}` + (i === msgs.length - 1 ? ' · new message' : '');
  }
  mt.textContent = title;
  const n = normMsg(msg);
  mb.append(h('div', { class: 'note' }, `role: ${n.role} · ${n.content.length} content block${n.content.length === 1 ? '' : 's'}` + (typeof msg.content === 'string' ? ' (content is a plain string)' : '')));
  n.content.forEach((b, j) => {
    const t = b && b.type || 'text';
    const rows = [];
    const full = txt => h('div', { class: 'full' }, txt == null ? '' : String(txt));
    if (t === 'text') rows.push(full(b.text));
    else if (/tool_use$/.test(t)) rows.push(kvTable({ id: b.id, name: b.name }), h('div', { class: 'h3' }, 'input'), jsonView(b.input == null ? {} : b.input, `modal/${r.id}/${r.msg}/${j}/in`));
    else if (t === 'tool_result') {
      rows.push(kvTable({ tool_use_id: b.tool_use_id, is_error: !!b.is_error, size: fmtChars(contentSize(b.content)) + ' chars' }), h('div', { class: 'h3' }, 'content'));
      if (typeof b.content === 'string') rows.push(full(b.content));
      else if (Array.isArray(b.content)) b.content.forEach((c, k) => rows.push(c && c.type === 'text' ? full(c.text) : c && c.type === 'image' ? imageInfo(c) : jsonView(c, `modal/${r.id}/${r.msg}/${j}/c${k}`)));
      else rows.push(jsonView(b.content, `modal/${r.id}/${r.msg}/${j}/c`));
      if (S.tools[b.tool_use_id]) rows.push(h('div', { class: 'h3' }, 'paired call'), pairRow(b.tool_use_id, `modal/${r.id}/${r.msg}/${j}/pair`));
    } else if (t === 'thinking') rows.push(full(b.thinking));
    else if (t === 'image' || t === 'document') rows.push(imageInfo(b));
    else rows.push(jsonView(b, `modal/${r.id}/${r.msg}/${j}`));
    if (b && b.cache_control) rows.push(h('div', null, 'cache_control marker: ', h('span', { class: 'mono' }, JSON.stringify(b.cache_control))));
    mb.append(h('div', { class: 'mblock' }, h('div', { style: 'margin-bottom:4px' }, badge(t), `block ${j}`), rows));
  });
  if (msg && msg.cache_control) mb.append(h('div', null, 'message cache_control: ', JSON.stringify(msg.cache_control)));
  mb.append(h('div', { class: 'h3' }, 'Raw JSON ', copyBtn(() => JSON.stringify(msg), 'copy raw JSON')), jsonView(msg, `modal/${r.id}/${r.msg}/raw`));
  modal.classList.add('on');
}
function closeModal() { const r = S.route; if (r.view === 'exchange' && r.msg != null) go(`#/exchange/${r.id}/${r.msg === 'reply' ? 'reply' : 'request'}`); }

// ------------------------------------------------------------------ routing
function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  let r = { view: 'none' };
  if (p[0] === 'exchange' && p[1]) {
    const id = Number(p[1]);
    if (p[2] === 'message') r = { view: 'exchange', id, tab: p[3] === 'reply' ? 'reply' : 'request', msg: p[3] };
    else r = { view: 'exchange', id, tab: ['request', 'reply', 'diff', 'raw'].includes(p[2]) ? p[2] : 'request' };
    S.sel = id; S.tab = r.tab;
  } else if (p[0] === 'tools') r = { view: 'tools', tool: p[1] || null };
  else if (p[0] === 'stats' && p[1]) r = { view: 'stat', metric: p[1], arg: p[2] || null };
  S.route = r;
  S.dirty.list = true; S.dirty.detail = true;
  flushNow();
  const row = r.view === 'exchange' && document.querySelector(`#list .row[data-id="${r.id}"]`);
  if (row && row.scrollIntoViewIfNeeded) row.scrollIntoViewIfNeeded(false); else if (row) row.scrollIntoView({ block: 'nearest' });
}
function flushNow() { flush(); }

// ------------------------------------------------------------------ wiring
document.getElementById('pause').onclick = () => {
  S.paused = !S.paused;
  if (!S.paused) { const q = S.queue; S.queue = []; for (const [n, d] of q) dispatch(n, d); }
  updatePauseBtn();
};
document.getElementById('clear').onclick = () => { if (confirm('Clear all exchanges from the server buffer?')) fetch('/api/clear', { method: 'POST' }).catch(() => {}); };
document.getElementById('toolsbtn').onclick = () => go('#/tools');
let filterT;
document.getElementById('filter').oninput = e => { clearTimeout(filterT); filterT = setTimeout(() => { S.filter = e.target.value.trim().toLowerCase(); S.dirty.list = true; schedule(); }, 150); };
document.getElementById('hidechecks').onchange = e => { S.hideChecks = e.target.checked; S.dirty.list = true; schedule(); };
document.getElementById('banner-x').onclick = () => { document.getElementById('banner').style.display = 'none'; };
document.getElementById('mclose').onclick = closeModal;
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { closeModal(); return; }
  const ids = S.visibleIds;
  if (['ArrowDown', 'ArrowUp', 'j', 'k'].includes(e.key) && ids.length) {
    e.preventDefault();
    let i = S.route.view === 'exchange' ? ids.indexOf(S.route.id) : -1;
    i = (e.key === 'ArrowDown' || e.key === 'j') ? Math.min(ids.length - 1, i + 1) : Math.max(0, i - 1);
    go(`#/exchange/${ids[i]}/${['request', 'reply', 'diff', 'raw'].includes(S.tab) ? S.tab : 'request'}`);
  } else if (/^[1-4]$/.test(e.key) && S.sel != null) go(`#/exchange/${S.sel}/${TABS[Number(e.key) - 1][0]}`);
  else if (e.key === 't') go('#/tools');
});
window.addEventListener('hashchange', route);
route();
connect();
</script>
