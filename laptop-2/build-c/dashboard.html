<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Traffic</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7; --surface: #ffffff; --surface2: #eef0f3; --border: #d8dce2; --text: #1c2026; --muted: #5f6873;
  --select: #dfeaff; --link: #1a5fd0; --danger: #c02626; --warn: #9a6200; --ok: #18794e;
  --system: #7a3fd1; --tools: #0b7f86; --conv: #2563c9; --new: #c8560c; --reply: #18794e; --other: #68707c;
  --user-bg: #eef4ff; --assistant-bg: #f6f7f9;
  --tool-use-bg: #fff6e8; --tool-result-bg: #e9f8f3; --thinking-bg: #f3effb;
  --j-key: #8a2fb0; --j-str: #1f7a3d; --j-num: #b4530a; --j-bool: #1a5fd0; --j-null: #7b8490;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14171b; --surface: #1c2025; --surface2: #262b31; --border: #363c44; --text: #e4e7eb; --muted: #9aa3ad;
    --select: #233a5e; --link: #7fb0ff; --danger: #ff7b7b; --warn: #e4b14f; --ok: #5fd39c;
    --system: #b28cf5; --tools: #4ac6cd; --conv: #7fb0ff; --new: #f5985a; --reply: #5fd39c; --other: #9aa3ad;
    --user-bg: #1d2a3f; --assistant-bg: #22262c;
    --tool-use-bg: #352a17; --tool-result-bg: #15332a; --thinking-bg: #2a2340;
    --j-key: #d59cf0; --j-str: #86d39d; --j-num: #f0a868; --j-bool: #7fb0ff; --j-null: #9aa3ad;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14171b; --surface: #1c2025; --surface2: #262b31; --border: #363c44; --text: #e4e7eb; --muted: #9aa3ad;
  --select: #233a5e; --link: #7fb0ff; --danger: #ff7b7b; --warn: #e4b14f; --ok: #5fd39c;
  --system: #b28cf5; --tools: #4ac6cd; --conv: #7fb0ff; --new: #f5985a; --reply: #5fd39c; --other: #9aa3ad;
  --user-bg: #1d2a3f; --assistant-bg: #22262c;
  --tool-use-bg: #352a17; --tool-result-bg: #15332a; --thinking-bg: #2a2340;
  --j-key: #d59cf0; --j-str: #86d39d; --j-num: #f0a868; --j-bool: #7fb0ff; --j-null: #9aa3ad;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button, .btn { font: inherit; font-size: 13px; color: var(--text); background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 3px 9px; cursor: pointer; }
button:hover, .btn:hover { border-color: var(--muted); text-decoration: none; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
button.link { background: none; border: 0; color: var(--link); padding: 0; }
button.link:hover { text-decoration: underline; }
button.mini { font-size: 11px; padding: 1px 6px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.nowrap { white-space: nowrap; }

#topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 7px 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
#topbar h1 { font-size: 15px; margin: 0 6px 0 0; }
#conn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; min-width: 96px; }
#conn i { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
#conn.live i { background: var(--ok); }
#filter { flex: 1 1 180px; min-width: 120px; font: inherit; padding: 3px 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--text); }
#banner { padding: 4px 12px; font-size: 12.5px; background: var(--tool-use-bg); color: var(--warn); border-bottom: 1px solid var(--border); }
#summary { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
.stat { display: inline-flex; flex-direction: column; padding: 2px 9px; border-radius: 5px; color: var(--text); background: var(--surface2); border: 1px solid transparent; min-width: 58px; }
.stat:hover { border-color: var(--link); text-decoration: none; }
.stat b { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }

#main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); }
#list { overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface); }
#list:empty::after { content: "No exchanges yet. Point the agent at the proxy to see traffic."; display: block; padding: 18px 14px; color: var(--muted); }
.row { display: block; color: var(--text); padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 12.5px; cursor: pointer; }
.row:hover { background: var(--surface2); text-decoration: none; }
.row.sel { background: var(--select); }
.row .l { display: flex; gap: 8px; align-items: baseline; white-space: nowrap; overflow: hidden; }
.row .id { font-weight: 700; }
.row .model { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row .sub { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.row .path { color: var(--muted); font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.st-ok { color: var(--ok); font-weight: 600; } .st-bad { color: var(--danger); font-weight: 600; }
.spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--border); border-top-color: var(--reply); border-radius: 50%; animation: spin .8s linear infinite; flex: none; align-self: center; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

#detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#dhead { padding: 7px 12px 0; background: var(--surface); }
#dtitle { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 13px; overflow-wrap: anywhere; }
#dtitle b { font-size: 14px; }
#strip { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0 6px; }
#strip .stat { min-width: 50px; padding: 1px 7px; }
#tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 8px; flex-wrap: wrap; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 6px 12px; color: var(--muted); }
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); font-weight: 600; border-bottom-color: var(--conv); }
.tab.t-reply { color: var(--reply); } .tab.t-reply.on { border-bottom-color: var(--reply); }
#scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 12px 40px; position: relative; }
#scroll.is-reply { box-shadow: inset 4px 0 0 var(--reply); }
.tabbar { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; min-height: 34px; padding: 4px 0; background: var(--bg); }
.tabbar .sp { flex: 1; }
.index-link { font-size: 12.5px; font-weight: 600; }

.panel { --accent: var(--other); margin: 0 0 18px; background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--accent); border-radius: 6px; }
.p-system { --accent: var(--system); } .p-tools { --accent: var(--tools); } .p-conv { --accent: var(--conv); } .p-new { --accent: var(--new); } .p-reply { --accent: var(--reply); }
.panel > header { position: sticky; top: 34px; z-index: 2; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 6px 10px; background: var(--surface); border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; }
.panel > header .name { color: var(--accent); font-weight: 700; }
.panel > header .sp { flex: 1; }
.panel > .pbody { padding: 10px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.p-new > .pbody { background: color-mix(in srgb, var(--new) 7%, transparent); }
.empty { color: var(--muted); font-style: italic; }

.tv { min-width: 0; }
.tv-body { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
.tv-body.clamped { max-height: calc(6 * 1.45em); overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent); mask-image: linear-gradient(to bottom, #000 62%, transparent); }
.tv-ctl { display: flex; gap: 12px; margin-top: 2px; font-size: 12px; }
.tv-ctl:empty { display: none; }

.msg { border: 1px solid var(--border); border-radius: 6px; min-width: 0; }
.msg > .mh { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 3px 9px; border-bottom: 1px solid var(--border); font-size: 12.5px; font-weight: 600; }
.msg > .mb { padding: 8px 9px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.msg .sp { flex: 1; }
.msg.user { background: var(--user-bg); margin-right: 24px; }
.msg.assistant { background: var(--assistant-bg); margin-left: 24px; }
.msg.user > .mh { color: var(--conv); } .msg.assistant > .mh { color: var(--reply); }
.block { min-width: 0; }
.block.b-tool_use, .pair .call { background: var(--tool-use-bg); }
.block.b-tool_result, .pair .result { background: var(--tool-result-bg); }
.block.b-thinking { background: var(--thinking-bg); }
.block.b-tool_use, .block.b-tool_result, .block.b-thinking, .block.b-other { padding: 6px 8px; border-radius: 5px; border: 1px solid var(--border); }
.bh { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 3px; font-size: 12px; }
.badge { display: inline-block; font: 600 10.5px/1.5 var(--mono); padding: 0 6px; border-radius: 3px; background: var(--surface2); border: 1px solid var(--border); white-space: nowrap; }
.badge.text { color: var(--conv); } .badge.tool_use { color: var(--warn); } .badge.tool_result { color: var(--tools); } .badge.thinking { color: var(--system); }
.badge.cache { color: var(--new); border-color: var(--new); }
.badge.err { color: #fff; background: var(--danger); border-color: var(--danger); }
.chip { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 9px; white-space: nowrap; border: 1px solid; }
.chip.pending { color: var(--warn); } .chip.paired { color: var(--ok); } .chip.no_result { color: var(--danger); }

.pair-slot { min-width: 0; }
.pair { border: 1px solid var(--border); border-radius: 6px; min-width: 0; background: var(--surface); }
.pair .ph { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 3px 9px; border-bottom: 1px solid var(--border); font-size: 12px; }
.pair .sides { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.pair .side { padding: 6px 9px; min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.pair .side + .side { border-left: 1px solid var(--border); }
.pair .sl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.pair.is-error .result { box-shadow: inset 3px 0 0 var(--danger); }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--link); } to { box-shadow: 0 0 0 3px transparent; } }

.json { font: 12.5px/1.5 var(--mono); min-width: 0; position: relative; }
.json-tools { float: right; margin-left: 8px; position: relative; z-index: 1; }
.jl { overflow-wrap: anywhere; }
.jc { margin-left: 2ch; }
.jt { display: inline-block; width: 1.5ch; padding: 0; background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; }
.jk { color: var(--j-key); } .js { color: var(--j-str); white-space: pre-wrap; } .jn { color: var(--j-num); } .jb { color: var(--j-bool); } .jz { color: var(--j-null); }
.jf { color: var(--muted); font-style: italic; }
.jl .tv { display: block; margin-left: 2ch; } .jl .tv-body { color: var(--j-str); }

.col-h { display: flex; gap: 6px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 2px 0; font-size: 12.5px; color: var(--text); }
.col-h::before { content: "\25B8"; color: var(--muted); }
.open > .col-h::before { content: "\25BE"; }

.tool-def { border: 1px solid var(--border); border-radius: 5px; padding: 7px 9px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tool-def .tname { font: 600 13px var(--mono); color: var(--tools); overflow-wrap: anywhere; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
th { font-weight: 600; color: var(--muted); font-size: 11.5px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover { background: var(--surface2); }
.usage { display: flex; flex-wrap: wrap; gap: 6px; }
.note { padding: 8px 10px; margin: 0 0 12px; border-radius: 5px; background: var(--surface2); font-size: 13px; overflow-wrap: anywhere; }
.note.err { color: var(--danger); border: 1px solid var(--danger); background: none; }
h3.sec { font-size: 13px; margin: 2px 0 4px; }

#modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: flex; justify-content: flex-end; }
#modal[hidden] { display: none; }
#mbox { width: min(860px, 100%); height: 100%; background: var(--bg); overflow-y: auto; overflow-x: hidden; padding: 12px 16px 40px; box-shadow: -6px 0 24px rgba(0,0,0,.3); }
#mbox .mt { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
#mbox .mt b { font-size: 15px; }
#mbox .mt .sp { flex: 1; }
#mbox section { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 10px; font-size: 12.5px; margin-bottom: 4px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; font-family: var(--mono); }

@media (max-width: 800px) {
  body { overflow: auto; height: auto; }
  #main { grid-template-columns: minmax(0, 1fr); }
  #list { max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--border); }
  #detail { height: 90vh; }
  .pair .sides { grid-template-columns: minmax(0, 1fr); }
  .pair .side + .side { border-left: 0; border-top: 1px solid var(--border); }
  .msg.user { margin-right: 0; } .msg.assistant { margin-left: 0; }
}
</style>
</head>
<body>
<div id="topbar">
  <h1>Agent Traffic</h1>
  <span id="conn"><i></i><span id="connText">connecting</span></span>
  <button id="pause" title="Hold new events (p)">Pause</button>
  <button id="clear">Clear</button>
  <a id="export" class="btn" href="/api/export" download>Export</a>
  <input id="filter" type="search" placeholder="Filter by path, model or text ( / )" aria-label="Filter exchanges">
  <button id="theme" title="Switch between automatic, light and dark">Theme: auto</button>
</div>
<div id="banner">Conversation contents are shown in full here. Be careful when sharing screenshots or exports.</div>
<div id="summary"></div>
<div id="main">
  <nav id="list" aria-label="Exchanges, newest first"></nav>
  <main id="detail">
    <div id="dhead"><div id="dtitle"></div><div id="strip"></div></div>
    <div id="tabs" role="tablist"></div>
    <div id="scroll"></div>
  </main>
</div>
<div id="modal" hidden><div id="mbox"></div></div>

<script>
"use strict";
/* All model and tool content goes through textContent via h(). innerHTML is never used.

   Choices made where SPEC.md is open (section in brackets). Server choices are in dashboard.py.
   [9 vs 6.3]   AC 2 says "Response tab", 6.3 says Reply tab. The tab is named Reply.
   [6.1 vs 6.5] 6.5 asks for more in the list row than 6.1 lists. The row shows both sets.
   [6.2]        The two lists disagree on five parts or four. Other parameters is a fifth
                panel after New message, and stays out of the four-part index.
   [1.1 vs 6.2] "In full" and "starts as a preview": the whole text is in the page, clamped by
                CSS to six visual lines until opened.
   [6.3 vs 6.10.1] Text that streams while the Reply tab is open stays open, otherwise a long
                reply would stop visibly growing at line 6. Viewed later, it starts collapsed.
   [6.6 vs 6.10.1] Long text in a drill-down starts open, since opening is the request for it.
   [6.6]        A reply has no place in messages, so its link uses index messages.length, the
                position it takes in the next request. Codex raw JSON shows the raw input items.
   [6.5]        Session stats cover the buffer since the last clear, labelled when older ones
                have been evicted. Wall clock is first start to last end. Average latency is the
                mean total duration. Cache hit is read / (input + read + write), summed over
                tokens, not averaged. Approximate tokens are chars / 4.
   [6.5]        Clicking a request's stat opens its reply message, where usage is shown. A
                session stat lists the exchanges with their value. A tool row filters the calls.
   [6.7]        cache_control is ignored when matching a conversation, because harnesses move
                it each turn. The nearest earlier prefix wins. A failed try is skipped so a
                retry compares with the last good request.
   [6.10.1]     Open or closed state lasts for the page's lifetime, not across a reload.
   [6.10.2]     The root is depth 0. Depths 0 to 2 start open, deeper ones start folded.
   [6.4]        Tools is a tab, since it covers the session, not one exchange.
   [6.1]        With nothing selected, the newest exchange is selected, so a first prompt is visible.
   [6.1]        Clear applies even while paused, and drops the held events.
*/

const S = {
  ex: new Map(),        // id -> exchange
  tools: new Map(),     // tool_use_id -> index entry
  gone: new Set(),      // ids the server no longer holds
  fetching: new Set(),
  evicted: 0,
  selected: null,
  view: "request",      // request | reply | diff | raw | tools | stats
  toolFilter: null,
  statMetric: null,
  anchor: null,
  modal: null,          // {id, idx}
  paused: false,
  held: [],
  filter: "",
  connected: false,
};
const openState = new Map();  // collapsible key -> bool; survives re-renders and exchange switches
const scrollMemo = new Map();
const rawText = new Map();    // id -> exact request text
const rows = new Map();       // id -> list row element
const dirtyRows = new Set();
let replyCtx = null;          // live handles into the Reply tab

const $ = (id) => document.getElementById(id);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

/* ---------- formatting ---------- */
const fmtTok = (n) => n == null ? "—" : n < 1000 ? String(n) : n < 1e6 ? (n / 1000).toFixed(n < 1e4 ? 1 : 0) + "k" : (n / 1e6).toFixed(2) + "M";
const fmtInt = (n) => n == null ? "—" : Number(n).toLocaleString("en-US");
const fmtMs = (n) => n == null ? "—" : n < 1000 ? Math.round(n) + "ms" : n < 60000 ? (n / 1000).toFixed(1) + "s" : Math.floor(n / 60000) + "m" + Math.round((n % 60000) / 1000) + "s";
const fmtCost = (c) => c == null ? "—" : "$" + (c >= 1 ? c.toFixed(2) : c >= 0.01 ? c.toFixed(3) : c.toFixed(4));
const fmtPct = (p) => p == null ? "—" : Math.round(p * 100) + "%";
const fmtChars = (n) => n < 1000 ? n + " chars" : (n / 1000).toFixed(1) + "k chars";
const fmtTime = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toTimeString().slice(0, 8); };
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const approxTok = (chars) => "~" + fmtTok(Math.round(chars / 4)) + " tokens";

function cacheHit(u) {
  if (!u) return null;
  const read = u.cache_read_input_tokens || 0;
  const total = (u.input_tokens || 0) + read + (u.cache_creation_input_tokens || 0);
  return total ? read / total : null;
}
const usageOf = (ex) => (ex.assembled && ex.assembled.usage) || {};
const modelOf = (ex) => (ex.assembled && ex.assembled.model) || (isObj(ex.request_body) && ex.request_body.model) || "";
const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const running = (ex) => !ex.ended_at && !ex.error;

/* ---------- request shape ---------- */
function viewOf(ex) {
  if (ex.request_view) return ex.request_view;
  const b = ex.request_body;
  if (!isObj(b)) return { system: [], tools: [], messages: [] };
  const sys = typeof b.system === "string" ? [{ type: "text", text: b.system }] : Array.isArray(b.system) ? b.system : [];
  return { system: sys, tools: Array.isArray(b.tools) ? b.tools : [], messages: Array.isArray(b.messages) ? b.messages : [] };
}
function blocksOf(m) {
  if (!isObj(m)) return [];
  if (typeof m.content === "string") return [{ type: "text", text: m.content }];
  return Array.isArray(m.content) ? m.content.filter(isObj) : [];
}
function replyMessage(ex) {
  const a = ex.assembled || {};
  return { role: "assistant", content: a.content || [], model: a.model, stop_reason: a.stop_reason, usage: a.usage };
}

/* ---------- collapsibles ---------- */
const isOpen = (key, dflt) => openState.has(key) ? openState.get(key) : !!dflt;

function isLong(t) {
  if (t.length > 1000) return true;
  let lines = 1;
  for (let i = t.indexOf("\n"); i >= 0; i = t.indexOf("\n", i + 1)) if (++lines > 12) return true;
  return false;
}

    statLink("cache read", fmtTok(read), "#/stats/tokens"), statLink("cache write", fmtTok(write), "#/stats/tokens"),
    statLink(unpriced ? `cost (${unpriced} unpriced)` : "cost", priced ? fmtCost(cost) : "—", "#/stats/cost"),
    statLink("wall clock", first != null ? fmtMs(lastT - first) : "—", "#/stats/wall"),
    statLink("avg latency", fmtMs(avg(lat)), "#/stats/latency"),
    statLink("cache hit", fmtPct(hit), "#/stats/cache"),
    statLink("tool calls", calls, "#/tools"));
}

/* ---------- scheduling ---------- */
let flushTimer = null, detailTimer = null, summaryDirty = true;
function scheduleFlush() {
  if (flushTimer != null) return;
  flushTimer = setTimeout(() => {
    flushTimer = null;
    for (const id of dirtyRows) {
      const ex = S.ex.get(id), el = rows.get(id);
      if (ex && el) {
        if (S.filter && !matches(ex)) { el.remove(); rows.delete(id); } else paintRow(el, ex);
      } else if (ex && !el && matches(ex)) rebuildList();
    }
    dirtyRows.clear();
    if (summaryDirty) { renderSummary(); summaryDirty = false; }
    if (S.ex.has(S.selected) && dirtyRowsHadSelected) { renderHead(); dirtyRowsHadSelected = false; }
  }, 50);
}
let dirtyRowsHadSelected = false;
function touch(ex) {
  dirtyRows.add(ex.id);
  summaryDirty = true;
  if (ex.id === S.selected) dirtyRowsHadSelected = true;
  scheduleFlush();
}
function scheduleDetail() {
  if (detailTimer != null) return;
  detailTimer = setTimeout(() => { detailTimer = null; renderDetail(); renderModal(); }, 250);
}
setInterval(() => {
  let any = false;
  for (const ex of S.ex.values()) if (running(ex)) { any = true; touch(ex); }
  if (any) summaryDirty = true;
}, 500);

/* ---------- events ---------- */
function newExchange(p) {
  return {
    id: p.id, started_at: p.time, ended_at: null, method: p.method, path: p.path, status: null, reason: null,
    request_headers: p.headers, request_body: p.body, request_view: p.request_view || null,
    response_headers: {}, response_events: [], response_body: null,
    assembled: { model: null, content: [], stop_reason: null, usage: {} },
    timing: { ttfb_ms: null, ttft_ms: null, total_ms: null, tokens_per_s: null }, cost_usd: null, error: null,
  };
}
function applyPatches(ex, patches) {
  const a = ex.assembled;
  for (const p of patches || []) {
    if (p.op === "start" || p.op === "stop") a.content[p.i] = p.block;
    else if (p.op === "append") { const b = a.content[p.i]; if (b) b[p.field] = (b[p.field] || "") + p.text; }
    else if (p.op === "meta") for (const k in p) if (k !== "op") a[k] = p[k];
  }
}
/* An event for an exchange we never saw means ours was dropped by a full queue. Refetch it. */
function recover(id) {
  if (S.gone.has(id) || S.fetching.has(id)) return;
  S.fetching.add(id);
  fetch(`/api/exchanges/${id}`).then((r) => r.ok ? r.json() : null).then((full) => {
    S.fetching.delete(id);
    if (!full) { S.gone.add(id); return; }
    if (S.ex.has(id)) return;
    delete full.request_raw;
    S.ex.set(id, full);
    rebuildList();
    touch(full);
  }).catch(() => S.fetching.delete(id));
}
function selectIfNone(id) {
  if (S.selected == null && !location.hash.replace(/^#\/?/, "")) {
    S.selected = id;
    renderDetail();
    refreshSelectionHighlight();
  }
}
const HANDLERS = {
  snapshot(list) {
    S.ex.clear();
    for (const ex of list) S.ex.set(ex.id, ex);
    rebuildList();
    summaryDirty = true;
    if (S.selected == null && list.length && !location.hash.replace(/^#\/?/, "")) S.selected = list[list.length - 1].id;
    applyRoute();
    scheduleFlush();
  },
  tools_snapshot(index) {
    S.tools = new Map(Object.entries(index));
    summaryDirty = true;
    scheduleFlush();
    renderDetail();
    renderModal();
  },
  exchange_started(p) {
    const ex = newExchange(p);
    S.ex.set(ex.id, ex);
    addRow(ex);
    summaryDirty = true;
    scheduleFlush();
    selectIfNone(ex.id);
  },
  exchange_response(p) {
    const ex = S.ex.get(p.id);
    if (!ex) return recover(p.id);
    ex.status = p.status; ex.reason = p.reason; ex.response_headers = p.headers;
    ex.timing.ttfb_ms = p.ttfb_ms;
    touch(ex);
  },
  exchange_delta(p) {
    const ex = S.ex.get(p.id);
    if (!ex) return recover(p.id);
    ex.response_events.push(p.event);
    applyPatches(ex, p.patches);
    if (p.ttft_ms != null) ex.timing.ttft_ms = p.ttft_ms;
    ex._search = null;
    if (ex.id === S.selected && S.view === "reply") replyPatch(ex, p.patches || []);
    else if (ex.id === S.selected && S.view === "raw") scheduleDetail();
    touch(ex);
  },
  exchange_done(p) { finish(p, null); },
  exchange_error(p) { finish(p, p.message); },
  tool_paired(p) { toolEvent(p); },
  tool_updated(p) { toolEvent(p); },
  exchange_evicted(p) {
    S.ex.delete(p.id);
    S.evicted++;
    for (const [id, e] of S.tools) if (e.call_exchange === p.id) S.tools.delete(id);
    const el = rows.get(p.id);
    if (el) { el.remove(); rows.delete(p.id); }
    summaryDirty = true;
    scheduleFlush();
  },
};
function finish(p, error) {
  const ex = S.ex.get(p.id);
  if (!ex) return recover(p.id);
  const wasRunningLiveHere = ex.id === S.selected && S.view === "reply";
  if (wasRunningLiveHere) {
    // Text the user watched stream stays open when the reply finishes.
    ex.assembled.content.forEach((b, i) => { if (b.type === "text") { const k = `x${ex.id}/reply/b${i}`; if (!openState.has(k)) openState.set(k, true); } });
  }
  ex.ended_at = p.ended_at;
  ex.error = error;
  ex.assembled = p.assembled;
  ex.timing = p.timing;
  ex.cost_usd = p.cost_usd;
  ex.response_body = p.response_body;
  if (p.status != null) ex.status = p.status;
  ex._search = null;
  touch(ex);
  if (ex.id === S.selected && ["reply", "raw"].includes(S.view)) renderDetail();
  if (S.modal && S.modal.id === ex.id) renderModal();
  if (S.view === "stats") scheduleDetail();
}
function toolEvent(p) {
  S.tools.set(p.tool_use_id, p);
  refreshPair(p.tool_use_id);
  summaryDirty = true;
  scheduleFlush();
  if (S.view === "tools") scheduleDetail();
}
function clearAll() {
  S.ex.clear(); S.tools.clear(); S.gone.clear(); S.held = []; S.evicted = 0;
  S.selected = null; S.modal = null;
  openState.clear(); scrollMemo.clear(); rawText.clear();
  if (location.hash) history.replaceState(null, "", location.pathname);
  if (S.view === "stats") S.view = "request";
  updatePauseLabel();
  rebuildList(); renderSummary(); renderDetail(); renderModal();
}
function dispatch(name, payload) {
  if (name === "cleared") { clearAll(); return; }
  if (S.paused) {
    if (name === "snapshot") S.held = [];  // a reconnect replaces everything held so far
    S.held.push([name, payload]);
    updatePauseLabel();
    return;
  }
  HANDLERS[name](payload);
}

/* ---------- connection ---------- */
function setConn(live) {
  S.connected = live;
  $("conn").classList.toggle("live", live);
  $("connText").textContent = live ? "live" : "reconnecting";
}
let source = null;
function connect() {
  source = new EventSource("/events");
  source.onopen = () => setConn(true);
  source.onerror = () => {
    setConn(false);
    if (source.readyState === EventSource.CLOSED) setTimeout(connect, 2000);
  };
  for (const name of [...Object.keys(HANDLERS), "cleared"]) {
    source.addEventListener(name, (e) => dispatch(name, JSON.parse(e.data)));
  }
}

/* ---------- routing ---------- */
function applyRoute() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  S.modal = null;
  if (parts[0] === "exchange" && parts[1]) {
    S.selected = Number(parts[1]);
    if (parts[2] === "message") {
      S.modal = { id: S.selected, idx: Number(parts[3]) };
      if (!["request", "reply", "diff", "raw"].includes(S.view)) S.view = "request";
    } else {
      S.view = ["request", "reply", "diff", "raw"].includes(parts[2]) ? parts[2] : (["request", "reply", "diff", "raw"].includes(S.view) ? S.view : "request");
      S.anchor = parts[3] || null;
    }
  } else if (parts[0] === "tools") {
    S.view = "tools";
    S.toolFilter = parts[1] || null;
  } else if (parts[0] === "stats") {
    S.view = "stats";
    S.statMetric = parts[1] || "requests";
  } else if (["request", "reply", "diff", "raw"].includes(parts[0])) {
    S.view = parts[0];
  }
  refreshSelectionHighlight();
  renderDetail();
  renderModal();
}
window.addEventListener("hashchange", applyRoute);

/* ---------- controls ---------- */
function updatePauseLabel() {
  $("pause").textContent = S.paused ? `Resume (${S.held.length} held)` : "Pause";
}
function togglePause() {
  S.paused = !S.paused;
  if (!S.paused) {
    const held = S.held;
    S.held = [];
    for (const [name, payload] of held) HANDLERS[name](payload);
  }
  updatePauseLabel();
}
$("pause").addEventListener("click", togglePause);
$("clear").addEventListener("click", () => { fetch("/api/clear", { method: "POST" }); });
let filterTimer = null;
$("filter").addEventListener("input", (e) => {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(() => { S.filter = e.target.value.trim().toLowerCase(); rebuildList(); }, 120);
});
const THEMES = ["auto", "light", "dark"];
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  $("theme").textContent = "Theme: " + t;
}
let theme = "auto";
try { theme = localStorage.getItem("theme") || "auto"; } catch {}
applyTheme(theme);
$("theme").addEventListener("click", () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % 3];
  applyTheme(theme);
  try { localStorage.setItem("theme", theme); } catch {}
});
$("modal").addEventListener("click", (e) => {
  if (e.target === $("modal") && S.modal) location.hash = `#/exchange/${S.modal.id}/${["request", "reply", "diff", "raw"].includes(S.view) ? S.view : "request"}`;
});
document.addEventListener("keydown", (e) => {
  const inField = e.target instanceof Element && e.target.matches("input, textarea");
  if (e.key === "Escape") {
    if (S.modal) location.hash = `#/exchange/${S.modal.id}/${["request", "reply", "diff", "raw"].includes(S.view) ? S.view : "request"}`;
    else if (inField) e.target.blur();
    return;
  }
  if (inField || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); $("filter").focus(); return; }
  if (e.key === "p") { togglePause(); return; }
  if (e.key === "j" || e.key === "k" || e.key === "ArrowDown" || e.key === "ArrowUp") {
    const els = [...$("list").children];
    if (!els.length) return;
    e.preventDefault();
    const at = els.findIndex((el) => Number(el.dataset.id) === S.selected);
    const down = e.key === "j" || e.key === "ArrowDown";
    const next = els[Math.max(0, Math.min(els.length - 1, at < 0 ? 0 : at + (down ? 1 : -1)))];
    location.hash = next.getAttribute("href");
    next.scrollIntoView({ block: "nearest" });
    return;
  }
  const tab = TABS[Number(e.key) - 1];
  if (tab) { e.preventDefault(); location.hash = tabHash(tab[0]); }
});

renderDetail();
renderSummary();
connect();
</script>
</body>
</html>
